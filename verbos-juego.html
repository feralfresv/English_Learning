<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verbos IQ — práctica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Karla:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0C2A31;
      --ink2: #123A44;
      --ink3: #1B4C58;
      --bone: #F6F1E4;
      --bone-dim: #CBBFA8;
      --amber: #F2B441;
      --mint: #5FD3A8;
      --rose: #FF6B6B;
      --slate: #82A5B0;
      --disp: 'Fraunces', Georgia, serif;
      --body: 'Karla', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ink);
      color: var(--bone);
      font-family: var(--body);
      display: flex;
      justify-content: center;
      padding: 20px 16px 40px;
      background-image: radial-gradient(circle at 20% -10%, #17505c 0%, transparent 55%);
    }

    .wrap {
      width: 100%;
      max-width: 660px
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px
    }

    h1 {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 26px;
      margin: 0;
      letter-spacing: -.02em
    }

    h1 em {
      font-style: normal;
      color: var(--amber)
    }

    .meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--slate);
      text-align: right;
      line-height: 1.5
    }

    .bar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap
    }

    .chip {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .04em;
      background: var(--ink2);
      border: 1px solid var(--ink3);
      color: var(--slate);
      padding: 6px 10px;
      border-radius: 99px;
    }

    .chip b {
      color: var(--bone);
      font-weight: 700
    }

    .chip.hot b {
      color: var(--amber)
    }

    .chip.tog {
      cursor: pointer;
      font-family: var(--mono)
    }

    .chip.tog:hover {
      border-color: var(--slate)
    }

    .chip.tog.off {
      opacity: .45
    }

    .spk {
      background: #E7E0CD;
      border: 1px solid #D5CCB6;
      border-radius: 9px;
      padding: 7px 9px;
      display: inline-flex;
      align-items: center;
      color: var(--ink);
      line-height: 0;
    }

    .spk:hover {
      background: var(--ink);
      color: var(--bone)
    }

    .spk svg {
      width: 17px;
      height: 17px
    }

    .cell {
      cursor: pointer
    }

    .cell:hover {
      background: #F1EADA
    }

    .cell.target:hover {
      background: #E3F2E9
    }

    .hint {
      font-family: var(--mono);
      font-size: 10px;
      color: #93A399;
      margin-top: 8px;
      text-align: right
    }

    .tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .tool {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .03em;
      background: var(--ink2);
      border: 1px solid var(--ink3);
      color: var(--bone);
      padding: 7px 12px;
      border-radius: 9px;
    }

    .tool:hover {
      border-color: var(--amber);
      color: var(--amber)
    }

    .tool.danger:hover {
      border-color: var(--rose);
      color: var(--rose)
    }

    .flash {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--mint);
      opacity: 0;
      transition: opacity .25s;
    }

    .flash.on {
      opacity: 1
    }

    .flash.bad {
      color: var(--rose)
    }

    .dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--slate);
    }

    .dot i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--slate);
      flex: none
    }

    .dot.live i {
      background: var(--mint)
    }

    .dot.local i {
      background: var(--amber)
    }

    .card {
      background: var(--bone);
      color: var(--ink);
      border-radius: 18px;
      padding: 24px 22px 22px;
      box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .65);
    }

    .ask {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #6C7F73;
      margin-bottom: 14px
    }

    .ask s {
      text-decoration: none;
      color: var(--ink);
      font-weight: 700
    }

    .prompt {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 4px
    }

    .word {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 44px;
      line-height: 1;
      letter-spacing: -.03em
    }

    .badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: .08em
    }

    .badge.I {
      background: var(--amber);
      color: #3A2A00
    }

    .badge.R {
      background: #D8D0BC;
      color: #4A4638
    }

    .es {
      font-family: var(--disp);
      font-style: italic;
      font-size: 18px;
      color: #6C7F73;
      margin-bottom: 20px
    }

    input[type=text] {
      width: 100%;
      font-family: var(--mono);
      font-size: 22px;
      padding: 13px 14px;
      border: 2px solid #D5CCB6;
      border-radius: 11px;
      background: #FFFDF7;
      color: var(--ink);
      outline: none;
    }

    input[type=text]:focus {
      border-color: var(--ink)
    }

    .choices {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    button {
      font-family: var(--body);
      cursor: pointer;
      border: none
    }

    .opt {
      flex: 1 1 30%;
      min-width: 88px;
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 700;
      padding: 14px 8px;
      border-radius: 11px;
      background: #FFFDF7;
      border: 2px solid #D5CCB6;
      color: var(--ink);
    }

    .opt:hover {
      border-color: var(--ink)
    }

    .go {
      margin-top: 12px;
      width: 100%;
      padding: 13px;
      border-radius: 11px;
      background: var(--ink);
      color: var(--bone);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .go:hover {
      background: var(--ink3)
    }

    .row {
      margin-top: 20px;
      border-top: 1px solid #DDD5C0;
      padding-top: 14px;
      display: none
    }

    .row.show {
      display: block
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      background: #DDD5C0;
      border: 1px solid #DDD5C0;
      border-radius: 8px;
      overflow: hidden
    }

    .cell {
      background: #FFFDF7;
      padding: 8px 5px;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px
    }

    .cell span {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #93A399
    }

    .cell b {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      word-break: break-word;
      line-height: 1.25
    }

    .cell.target {
      background: #EEF7F1
    }

    .cell.target.bad {
      background: #FFEDED
    }

    .verdict {
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.5
    }

    .verdict .ok {
      color: #0F7A54;
      font-weight: 800
    }

    .verdict .no {
      color: #C0392B;
      font-weight: 800
    }

    .verdict .fix {
      font-family: var(--mono);
      font-weight: 700
    }

    .note {
      margin-top: 8px;
      font-size: 13px;
      color: #8A5A2B;
      background: #FDF3E0;
      padding: 8px 10px;
      border-radius: 8px
    }

    .map {
      margin-top: 22px
    }

    .map h2 {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--slate);
      font-weight: 400;
      margin: 0 0 10px
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11px, 1fr));
      gap: 3px
    }

    .t {
      aspect-ratio: 1;
      border-radius: 2px;
      background: #1B4049
    }

    .t.b1 {
      background: #8A3D3D
    }

    .t.b2 {
      background: #A9702F
    }

    .t.b3 {
      background: #8C8A34
    }

    .t.b4 {
      background: #4A8A62
    }

    .t.b5 {
      background: var(--mint)
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--slate)
    }

    .legend i {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: -1px
    }

    footer {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .link {
      background: none;
      color: var(--slate);
      font-size: 12px;
      text-decoration: underline;
      padding: 0
    }

    .link:hover {
      color: var(--bone)
    }

    .warn {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--amber)
    }

    @media (max-width:480px) {
      .word {
        font-size: 34px
      }

      .cell b {
        font-size: 10px
      }

      .cell {
        min-height: 46px
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Verbos <em>IQ</em></h1>
      <div>
        <div class="meta" id="meta"></div>
        <div class="dot" id="dot" style="justify-content:flex-end; margin-top:5px"><i></i><span>…</span></div>
      </div>
    </header>

    <div class="bar">
      <div class="chip">sesión <b id="s-tot">0</b></div>
      <div class="chip">aciertos <b id="s-ok">0</b></div>
      <div class="chip hot">racha <b id="s-streak">0</b></div>
      <div class="chip">dominados <b id="s-dom">0</b>/201</div>
      <button class="chip tog" id="snd">&#9835; sonido <b>on</b></button>
    </div>

    <div class="card">
      <div class="ask" id="ask"></div>
      <div class="prompt">
        <div class="word" id="word"></div>
        <button class="spk" id="spk" title="Escuchar (S)" aria-label="Escuchar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
          </svg>
        </button>
        <div class="badge" id="badge"></div>
      </div>
      <div class="es" id="es"></div>

      <div id="answerArea"></div>

      <div class="row" id="row">
        <div class="grid" id="grid"></div>
        <div class="verdict" id="verdict"></div>
        <div class="note" id="note" style="display:none"></div>
        <div class="hint">toca cualquier celda para escucharla</div>
        <button class="go" id="next">Siguiente</button>
      </div>
    </div>

    <div class="map">
      <h2>Tu mapa — 201 verbos</h2>
      <div class="tiles" id="tiles"></div>
      <div class="legend">
        <span><i style="background:#1B4049"></i>sin ver</span>
        <span><i style="background:#8A3D3D"></i>falla</span>
        <span><i style="background:#A9702F"></i>flojo</span>
        <span><i style="background:#8C8A34"></i>va</span>
        <span><i style="background:#4A8A62"></i>casi</span>
        <span><i style="background:#5FD3A8"></i>dominado</span>
      </div>
    </div>

    <footer>
      <div class="tools">
        <button class="tool" id="exp">&#8681; Exportar JSON</button>
        <button class="tool" id="imp">&#8679; Importar JSON</button>
        <button class="tool danger" id="reset">Borrar progreso</button>
        <input type="file" id="file" accept=".json,application/json" style="display:none">
      </div>
      <span class="flash" id="flash"></span>
      <span class="warn" id="warn"></span>
    </footer>
  </div>

      past: { campo: 'past', ask: '¿Cuál es el <s>past form</s>?' },
      part: { campo: 'part', ask: '¿Cuál es el <s>past participle</s>?' },
      ing: { campo: 'ing', ask: '¿Cuál es la forma <s>-ing</s>?' },
      third: { campo: 'third', ask: '¿Cuál es la forma de <s>he / she / it</s>?' },
      ri: { campo: 'ri', ask: '¿Es <s>regular o irregular</s>?' },
      ed: { campo: 'ed', ask: '¿Cómo suena el <s>-ed</s>?' },
      es: { campo: 'base', ask: '¿Cuál es el <s>verbo en inglés</s>?' }
    };

    function tiposDe(v) {
      const t = [];
      ['past', 'part', 'ing', 'third'].forEach(k => { if (v[k] && v[k] !== '--') t.push(k); });
      t.push('ri', 'es');
      if (v.ed) t.push('ed');
      return t;
    }

    const PESO = [9, 6, 4, 3, 2, 1];
    function caja(base) { return (prog[base] && prog[base].box) || 0; }

    let anterior = null;
    function elegir() {
      const pool = [];
      VERBOS.forEach(v => {
        if (VERBOS.length > 1 && v.base === anterior) return;
        const p = PESO[caja(v.base)];
        for (let i = 0; i < p; i++) pool.push(v);
      });
      const v = pool[Math.floor(Math.random() * pool.length)];
      anterior = v.base;
      const t = tiposDe(v);
      return { v, tipo: t[Math.floor(Math.random() * t.length)] };
    }

    /* ---------- estado ---------- */
    let actual = null, sTot = 0, sOk = 0, streak = 0;

    function aceptadas(v, tipo) {
      const val = v[TIPOS[tipo].campo];
      const set = new Set([norm(val)]);
      val.split('/').forEach(p => { if (p.trim()) set.add(norm(p)); });
      if (tipo === 'es') { (porEspanol[norm(v.es)] || []).forEach(b => set.add(norm(b))); }
      return set;
    }

    function pintar() {
      const { v, tipo } = actual;
      document.getElementById('ask').innerHTML = TIPOS[tipo].ask;
      document.getElementById('word').textContent = tipo === 'es' ? v.es : v.base;
      document.getElementById('es').textContent = tipo === 'es' ? '' : v.es;

      const badge = document.getElementById('badge');
      if (tipo === 'ri' || tipo === 'es') { badge.style.display = 'none'; }
      else {
        badge.style.display = ''; badge.className = 'badge ' + v.ri;
        badge.textContent = v.ri === 'I' ? 'IRREGULAR' : 'REGULAR';
      }

      const spk = document.getElementById('spk');
      spk.style.display = (tipo === 'es') ? 'none' : '';
      spk.onclick = () => hablar(v.base, true);

      const area = document.getElementById('answerArea');
      area.innerHTML = '';
      if (tipo === 'ri') {
        area.innerHTML = '<div class="choices">' +
          '<button class="opt" data-v="R">Regular</button>' +
          '<button class="opt" data-v="I">Irregular</button></div>';
        area.querySelectorAll('.opt').forEach(b => b.onclick = () => revisar(b.dataset.v));
      } else if (tipo === 'ed') {
        area.innerHTML = '<div class="choices">' +
          ['/t/', '/d/', '/id/'].map(o => '<button class="opt" data-v="' + o + '">' + o + '</button>').join('') +
          '</div>';
        area.querySelectorAll('.opt').forEach(b => b.onclick = () => revisar(b.dataset.v));
      } else {
        area.innerHTML = '<input type="text" id="inp" autocomplete="off" autocapitalize="off" ' +
          'autocorrect="off" spellcheck="false" placeholder="escribe tu respuesta">' +
          '<button class="go" id="check">Revisar</button>';
        const inp = document.getElementById('inp');
        inp.focus();
        inp.onkeydown = e => { if (e.key === 'Enter') revisar(inp.value); };
        document.getElementById('check').onclick = () => revisar(inp.value);
      }

      document.getElementById('row').classList.remove('show');
      document.getElementById('note').style.display = 'none';
      refrescar();
    }

    function revisar(entrada) {
      const { v, tipo } = actual;
      const bien = aceptadas(v, tipo).has(norm(String(entrada)));

      const p = prog[v.base] || { box: 0, ok: 0, mal: 0 };
      if (bien) { p.box = Math.min(5, p.box + 1); p.ok++; sOk++; streak++; }
      else { p.box = 1; p.mal++; streak = 0; }
      prog[v.base] = p; sTot++;
      guardar(prog);

      const campo = TIPOS[tipo].campo;
      const cols = [['base', 'base'], ['3ª pers.', 'third'], ['pasado', 'past'], ['participio', 'part'], ['-ing', 'ing']];
      const grid = document.getElementById('grid');
      grid.innerHTML = cols.map(([et, k]) => {
        const esObjetivo = (k === campo && tipo !== 'es' && tipo !== 'ri' && tipo !== 'ed');
        const cls = 'cell' + (esObjetivo ? ' target' + (bien ? '' : ' bad') : '');
        return '<div class="' + cls + '" data-say="' + v[k] + '"><span>' + et + '</span><b>' + v[k] + '</b></div>';
      }).join('');
      grid.querySelectorAll('.cell').forEach(c => c.onclick = () => hablar(c.dataset.say, true));

      let txt;
      if (bien) {
        txt = '<span class="ok">Correcto.</span>';
        if (tipo === 'ri') txt += ' ' + (v.ri === 'I' ? 'Irregular — hay que memorizarlo.' : 'Regular — se le agrega -ed.');
        if (tipo === 'ed') txt += ' <span class="fix">' + v.base + 'ed</span> suena <span class="fix">' + v.ed + '</span>.';
      } else {
        const correcto = tipo === 'ri' ? (v.ri === 'I' ? 'Irregular' : 'Regular') : v[campo];
        txt = '<span class="no">No.</span> Era <span class="fix">' + correcto + '</span>.';
        if (tipo === 'es') txt += ' Escribiste otra cosa — este verbo lo vuelves a ver pronto.';
      }
      if (v.ri === 'R' && v.ed && tipo !== 'ed') txt += ' El <span class="fix">-ed</span> suena <span class="fix">' + v.ed + '</span>.';
      document.getElementById('verdict').innerHTML = txt;

      if (v.nota) {
        const n = document.getElementById('note');
        n.textContent = '⚠ ' + v.nota;
        n.style.display = '';
      }

      document.getElementById('row').classList.add('show');
      hablar(tipo === 'ri' ? v.base : tipo === 'ed' ? v.past : v[campo]);
      document.getElementById('next').focus();
      refrescar();
    }

    function refrescar() {
      document.getElementById('s-tot').textContent = sTot;
      document.getElementById('s-ok').textContent = sOk;
      document.getElementById('s-streak').textContent = streak;
      const dom = VERBOS.filter(v => caja(v.base) >= 5).length;
      document.getElementById('s-dom').textContent = dom;
      const vistos = Object.keys(prog).length;
      document.getElementById('meta').innerHTML = vistos + ' / ' + VERBOS.length + ' vistos<br>' +
        (sTot ? Math.round(sOk / sTot * 100) + '% en esta sesión' : 'empieza cuando quieras');
      document.getElementById('tiles').innerHTML =
        VERBOS.map(v => '<div class="t b' + caja(v.base) + '" title="' + v.base + '"></div>').join('');
    }

    /* ---------- exportar / importar ---------- */
    function flash(msg, malo) {
      const f = document.getElementById('flash');
      f.textContent = msg;
      f.className = 'flash on' + (malo ? ' bad' : '');
      clearTimeout(f._t);
      f._t = setTimeout(() => { f.className = 'flash' + (malo ? ' bad' : ''); }, 3200);
    }

    document.getElementById('exp').onclick = () => {
      const hoy = new Date().toISOString().slice(0, 10);
      const blob = new Blob([JSON.stringify(prog, null, 1)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'verbos-progreso-' + hoy + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      flash('guardado: verbos-progreso-' + hoy + '.json');
    };

    document.getElementById('imp').onclick = () => document.getElementById('file').click();

    document.getElementById('file').onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      const lector = new FileReader();
      lector.onload = () => {
        let datos;
        try { datos = JSON.parse(lector.result); }
        catch (err) { flash('ese archivo no es JSON válido', true); return; }
        if (!datos || typeof datos !== 'object' || Array.isArray(datos)) {
          flash('el archivo no tiene el formato esperado', true); return;
        }
        const validos = {};
        let ignorados = 0;
        const conocidos = new Set(VERBOS.map(v => v.base));
        Object.keys(datos).forEach(k => {
          const d = datos[k];
          if (!conocidos.has(k) || !d || typeof d !== 'object') { ignorados++; return; }
          validos[k] = {
            box: Math.max(0, Math.min(5, parseInt(d.box, 10) || 0)),
            ok: Math.max(0, parseInt(d.ok, 10) || 0),
            mal: Math.max(0, parseInt(d.mal, 10) || 0)
          };
        });
        const n = Object.keys(validos).length;
        if (!n) { flash('no encontré verbos válidos en ese archivo', true); return; }
        const dom = Object.values(validos).filter(v => v.box >= 5).length;
        if (!confirm('Cargar ' + n + ' verbos (' + dom + ' dominados)?\n\nEsto reemplaza tu progreso actual.')) return;
        prog = validos;
        guardar(prog);
        sTot = sOk = streak = 0;
        actual = elegir(); pintar();
        flash('cargados ' + n + ' verbos' + (ignorados ? ' — ' + ignorados + ' ignorados' : ''));
      };
      lector.onerror = () => flash('no pude leer el archivo', true);
      lector.readAsText(f);
      e.target.value = '';
    };

    document.getElementById('next').onclick = () => { actual = elegir(); pintar(); };
    document.getElementById('reset').onclick = () => {
      if (!confirm('¿Borrar todo tu progreso guardado?\n\nSi no lo has exportado, no se puede recuperar.')) return;
      prog = {}; guardar(prog); sTot = sOk = streak = 0; actual = elegir(); pintar();
    };
    document.addEventListener('keydown', e => {
      if ((e.key === 's' || e.key === 'S') && e.target.tagName !== 'INPUT') {
        e.preventDefault(); hablar(actual.v.base, true); return;
      }
      if (e.key === 'Enter' && document.getElementById('row').classList.contains('show')) {
        e.preventDefault(); actual = elegir(); pintar();
      }
    });

    pintarSonido();
    arrancar();
  </script>
</body>
